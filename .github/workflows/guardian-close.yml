name: guardian-close

on:
  schedule:
    # Same-evening weekday slots, Asia/Ho_Chi_Minh (UTC+7, no daylight saving).
    # The runner clock does not name the sealed session; close_job seals the
    # accepted VNINDEX daily bar_session after its own validation.
    #
    # Primary:  19:30 ICT = 12:30 UTC
    # Backup 1: 21:30 ICT = 14:30 UTC
    # Backup 2: 22:30 ICT = 15:30 UTC
    #
    # Retries are best-effort only. GitHub Actions schedules can still slip past
    # ICT midnight or beyond the seal window (next calendar day 09:00 ICT).
    # Duplicate starts are serialized. close_job probes VNINDEX, checks the seal
    # window, then returns unchanged if a sealed T0 already exists — before any
    # watchlist rescan or rewrite. Retries do NOT invent observed_at; a separate
    # persisted evening observation may still be required if the first runnable
    # start is already late.
    - cron: "30 12 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# One seal at a time. Do not cancel an in-flight seal when a backup slot fires.
concurrency:
  group: guardian-research-close
  cancel-in-progress: false

jobs:
  guardian:
    # Independent of post-close-research.yml. Leave this variable unset
    # to keep the job off. Clearing it is the rollback.
    if: vars.GUARDIAN_RESEARCH_SNAPSHOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      # Independent of the Research Ledger secrets. Leave either value unset
      # and the T+ download stays unavailable; the seal step still finishes.
      GUARDIAN_REFERENCE_URL: ${{ secrets.GUARDIAN_REFERENCE_URL }}
      GUARDIAN_REFERENCE_TOKEN: ${{ secrets.GUARDIAN_REFERENCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seal Guardian T0 from the close scan
        id: seal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIAN_RESEARCH_SNAPSHOT_ENABLED: ${{ vars.GUARDIAN_RESEARCH_SNAPSHOT_ENABLED }}
          GITHUB_REPO_OWNER: SONVODAI
          GITHUB_REPO_NAME: scanner-ga-chien-clean
          GITHUB_BRANCH: main
        run: |
          set -euo pipefail
          python -m research.guardian_research.close_job | tee seal_result.json

      - name: Refresh T+ evidence without resealing
        id: outcomes
        if: always() && steps.seal.outcome == 'success'
        run: python -m research.guardian_research.outcomes

      - name: Publish changed T+ evidence
        if: always() && steps.outcomes.outcome == 'success'
        run: |
          set -euo pipefail
          cp research/guardian_research/outcomes.json /tmp/guardian-outcomes.json
          git checkout -- .
          git clean -fd -- data/guardian_research/sessions
          git fetch origin main
          git rebase origin/main
          cp /tmp/guardian-outcomes.json research/guardian_research/outcomes.json
          git add research/guardian_research/outcomes.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update Guardian Research T+ evidence"
          git push origin HEAD:main

      - name: Publish seal outcome
        if: always() && steps.seal.outcome != 'skipped'
        run: |
          {
            echo "## Guardian close seal outcome"
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Seal step: \`${{ steps.seal.outcome }}\`"
            echo "- Note: same-evening retries are best-effort; schedule delay can still miss the seal window."
            echo
            if [ -f seal_result.json ]; then
              echo '```json'
              cat seal_result.json
              echo '```'
            else
              echo "No seal_result.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
